name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-version: '8.2'
            laravel-version: '12.*'
            testbench-version: '10.*'
          - php-version: '8.3'
            laravel-version: '12.*'
            testbench-version: '10.*'
          - php-version: '8.4'
            laravel-version: '12.*'
            testbench-version: '10.*'
          - php-version: '8.5'
            laravel-version: '12.*'
            testbench-version: '10.*'
          - php-version: '8.3'
            laravel-version: '13.*'
            testbench-version: '11.*'
          - php-version: '8.4'
            laravel-version: '13.*'
            testbench-version: '11.*'
          - php-version: '8.5'
            laravel-version: '13.*'
            testbench-version: '11.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, xml, zip
          tools: composer:2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer and vendor
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-

      - name: Require targeted Laravel and Testbench versions
        run: |
          composer require --no-update "illuminate/support:${{ matrix.laravel-version }}"
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench-version }}"

      - name: Install dependencies (update lock)
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run phpstan
        run: composer run-script phpstan

      - name: Run test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer run-script test
